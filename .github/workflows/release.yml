name: Build & Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: SteamFriendsGameFinder-Windows.exe
          - os: macos-latest
            asset_name: SteamFriendsGameFinder-macOS.zip
          - os: ubuntu-latest
            asset_name: SteamFriendsGameFinder-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned to versions with a known working build; update deliberately
          pip install "pyinstaller==6.22.3" pillow "flet[cli,desktop]==1.0.5" -r requirements.txt

      - name: Build executable with Flet
        shell: bash
        run: |
          flet pack run_desktop.py --name SteamFriendsGameFinder --icon assets/icon.png --yes

      - name: Check bundle contents
        shell: bash
        run: |
          exe=dist/SteamFriendsGameFinder
          [ "${{ runner.os }}" = "Windows" ] && exe=dist/SteamFriendsGameFinder.exe
          [ "${{ runner.os }}" = "macOS" ] && exe=dist/SteamFriendsGameFinder.app/Contents/MacOS/SteamFriendsGameFinder
          pyi-archive_viewer -r -b "$exe" > contents.txt
          grep -i 'flet_desktop.app' contents.txt || true
          grep -qx ' *src\.ui\.app' contents.txt || { echo "Missing: app code"; exit 1; }
          grep -qx ' *flet_desktop' contents.txt || { echo "Missing: flet_desktop"; exit 1; }
          # Windows prints paths with backslashes
          grep -q '^ *flet_desktop[/\\]app[/\\]flet-' contents.txt || { echo "Missing: Flet window client"; exit 1; }

      - name: Prepare Windows artifact
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mv dist/SteamFriendsGameFinder.exe dist/${{ matrix.asset_name }}

      - name: Prepare macOS artifact
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          codesign --verify --deep --strict dist/SteamFriendsGameFinder.app
          ditto -c -k --keepParent dist/SteamFriendsGameFinder.app dist/${{ matrix.asset_name }}
          # Unpack the zip again and check that the app survived it
          ditto -x -k dist/${{ matrix.asset_name }} unzipped
          codesign --verify --deep --strict unzipped/SteamFriendsGameFinder.app

      - name: Prepare Linux artifact
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mv dist/SteamFriendsGameFinder dist/${{ matrix.asset_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
